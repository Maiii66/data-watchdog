name: CI/CD Pipeline - Data Watchdog

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: datawatchdog
          POSTGRES_USER: watchdog
          POSTGRES_PASSWORD: watchdog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U watchdog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Create .env file
        run: |
          cat > .env <<'ENVEOF'
          DB_USER=watchdog
          DB_PASS=watchdog
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=datawatchdog
          SMTP_HOST=smtp.gmail.com
          SMTP_PORT=587
          ENVEOF

      - name: Wait for PostgreSQL readiness
        run: |
          for i in $(seq 1 20); do
            pg_isready -h localhost -p 5432 -U watchdog && break
            echo "Waiting for PostgreSQL... ($i)"
            sleep 1
          done

      - name: Run flake8 linting
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

      - name: Run pytest with coverage
        env:
          DB_USER: watchdog
          DB_PASS: watchdog
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: datawatchdog
        run: pytest tests/ -v --tb=short --cov=. --cov-report=term-missing --cov-report=html
        continue-on-error: false

      - name: Build Docker image
        run: docker build -f Dockerfile.prod -t data-watchdog:${{ github.sha }} .

      - name: Send Slack notification (success)
        if: success() && github.event_name == 'push'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d '{
                "text": ":white_check_mark: *Data Watchdog CI/CD - Build Successful*\n\n*Branch:* ${{ github.ref_name }}\n*Author:* ${{ github.actor }}\n*Commit:* ${{ github.event.head_commit.message }}\n*Status:* All tests passed :tada:\n*Link:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
              }'
          fi

      - name: Send Slack notification (failure)
        if: failure() && github.event_name == 'push'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d '{
                "text": ":x: *Data Watchdog CI/CD - Build Failed*\n\n*Branch:* ${{ github.ref_name }}\n*Author:* ${{ github.actor }}\n*Commit:* ${{ github.event.head_commit.message }}\n*Status:* Build failed - please investigate :warning:\n*Link:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
              }'
          fi

      - name: Send Gmail notification (success)
        if: success() && github.event_name == 'push'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          if [ -n "$SMTP_USER" ] && [ -n "$ALERT_EMAIL" ]; then
            python -c "
          import smtplib
          from email.mime.text import MIMEText
          from email.utils import formatdate

          subject = 'Data Watchdog Build Passed - ${{ github.ref_name }}'
          body = 'Hello,\\n\\nThe CI/CD pipeline for Data Watchdog has completed successfully.\\n\\nBranch: ${{ github.ref_name }}\\nCommit: ${{ github.event.head_commit.message }}\\nAuthor: ${{ github.actor }}\\nStatus: All tests passed\\n\\nView the full run here:\\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\\n\\nThis message was sent automatically by Data Watchdog CI/CD.'

          msg = MIMEText(body, 'plain', 'utf-8')
          msg['Subject'] = subject
          msg['From'] = '${{ secrets.SMTP_FROM }}'
          msg['To'] = '${{ secrets.ALERT_EMAIL }}'
          msg['Date'] = formatdate(localtime=True)

          with smtplib.SMTP('smtp.gmail.com', 587, timeout=30) as server:
              server.starttls()
              server.login('${{ secrets.SMTP_USER }}', '${{ secrets.SMTP_PASS }}')
              server.sendmail('${{ secrets.SMTP_FROM }}', '${{ secrets.ALERT_EMAIL }}', msg.as_string())
          "
          fi

      - name: Send Gmail notification (failure)
        if: failure() && github.event_name == 'push'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          if [ -n "$SMTP_USER" ] && [ -n "$ALERT_EMAIL" ]; then
            python -c "
          import smtplib
          from email.mime.text import MIMEText
          from email.utils import formatdate

          subject = 'Data Watchdog Build FAILED - ${{ github.ref_name }}'
          body = 'Hello,\\n\\nThe CI/CD pipeline for Data Watchdog has FAILED.\\n\\nBranch: ${{ github.ref_name }}\\nCommit: ${{ github.event.head_commit.message }}\\nAuthor: ${{ github.actor }}\\nStatus: Build failed - please investigate\\n\\nView the full run here:\\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\\n\\nThis message was sent automatically by Data Watchdog CI/CD.'

          msg = MIMEText(body, 'plain', 'utf-8')
          msg['Subject'] = subject
          msg['From'] = '${{ secrets.SMTP_FROM }}'
          msg['To'] = '${{ secrets.ALERT_EMAIL }}'
          msg['Date'] = formatdate(localtime=True)

          with smtplib.SMTP('smtp.gmail.com', 587, timeout=30) as server:
              server.starttls()
              server.login('${{ secrets.SMTP_USER }}', '${{ secrets.SMTP_PASS }}')
              server.sendmail('${{ secrets.SMTP_FROM }}', '${{ secrets.ALERT_EMAIL }}', msg.as_string())
          "
          fi
