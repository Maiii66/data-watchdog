name: CI/CD Pipeline - Data Watchdog

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: datawatchdog
          POSTGRES_USER: watchdog
          POSTGRES_PASSWORD: watchdog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U watchdog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Create .env file
        run: |
          cat > .env <<'ENVEOF'
          DB_USER=watchdog
          DB_PASS=watchdog
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=datawatchdog
          SMTP_HOST=smtp.gmail.com
          SMTP_PORT=587
          ENVEOF

      - name: Wait for PostgreSQL readiness
        run: |
          for i in $(seq 1 20); do
            pg_isready -h localhost -p 5432 -U watchdog && break
            echo "Waiting for PostgreSQL... ($i)"
            sleep 1
          done

      - name: Run flake8 linting
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

      - name: Run pytest with coverage
        env:
          DB_USER: watchdog
          DB_PASS: watchdog
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: datawatchdog
        run: pytest tests/ -v --tb=short --cov=. --cov-report=term-missing --cov-report=html
        continue-on-error: false

      - name: Build Docker image
        run: docker build -f Dockerfile.prod -t data-watchdog:${{ github.sha }} .
