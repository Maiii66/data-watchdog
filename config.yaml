# Data Watchdog Configuration
# All thresholds and settings in one place - no code changes needed to tune.

# ── Data Sources ──────────────────────────────────────────────
data_sources:
  - name: orders_pg
    type: postgres
    connection_string: postgresql://${DB_USER}:${DB_PASS}@${DB_HOST}:${DB_PORT}/${DB_NAME}
    table: orders
    lineage:
      - Revenue Dashboard
      - Marketing Report
      - Fraud Detection Model

  - name: sales_data_pg
    type: postgres
    connection_string: postgresql://${DB_USER}:${DB_PASS}@${DB_HOST}:${DB_PORT}/${DB_NAME}
    table: sales_data
    lineage:
      - Sales Analytics
      - Inventory System

  - name: orders_csv
    type: csv
    file: data/orders.csv
    lineage:
      - Local Backup Check

# ── Storage ───────────────────────────────────────────────────
storage:
  database: meta.db
  history_limit: 30

# ── Check Thresholds ──────────────────────────────────────────
checks:
  volume_anomaly:
    enabled: true
    z_threshold: 2.0
    min_history: 5

  schema_change:
    enabled: true

  null_spike:
    enabled: true
    threshold_pct: 20.0

  freshness:
    enabled: true
    max_hours: 2

# ── Scheduling ────────────────────────────────────────────────
schedule:
  enabled: true
  interval: 30m

# ── Notifications ─────────────────────────────────────────────
# Enabled channels send alerts when checks fail. Missing/empty
# credentials in .env simply disable that channel.
notifications:
  slack:
    enabled: true
    webhook_url: ${SLACK_WEBHOOK_URL}
  email:
    enabled: true
    smtp_host: ${SMTP_HOST}
    smtp_port: 587
    use_tls: true
    username: ${SMTP_USER}
    password: ${SMTP_PASS}
    from: ${SMTP_FROM}
    to:
      - ${ALERT_EMAIL}
