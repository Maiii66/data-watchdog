services:
  postgres:
    image: postgres:16
    container_name: datawatchdog-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-watchdog}
      POSTGRES_PASSWORD: ${DB_PASS:-watchdog}
      POSTGRES_DB: ${DB_NAME:-datawatchdog}
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-watchdog}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
